<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ title }}</title><style>*{box-sizing:border-box}body{margin:0;background:#f6f7f3;color:#20332c;font:16px/1.6 system-ui,sans-serif}header,main,footer{max-width:1000px;margin:auto;padding:24px}header{display:flex;justify-content:space-between;border-bottom:1px solid #dbe2dc}a{color:#285b4d}header a:first-child{font-weight:750;text-decoration:none}.hero{display:grid;grid-template-columns:1fr 1fr;gap:48px;padding:50px 0}h1{font-size:clamp(32px,5vw,48px);line-height:1.12;letter-spacing:-.04em;margin:16px 0 24px}h2{font-size:22px}.eyebrow{font-size:12px;font-weight:750;letter-spacing:.14em;color:#527064}.intro{color:#53655c}.card,.result{padding:28px;border:1px solid #dce2dc;background:white;border-radius:14px;box-shadow:0 10px 30px #183b2910}label{display:block;margin:0 0 18px;font-size:14px;font-weight:650}input,textarea{display:block;width:100%;margin-top:7px;padding:11px;border:1px solid #bfcac2;border-radius:5px;font:inherit;color:inherit;background:white}button{width:100%;padding:13px;background:#2c6653;color:white;border:0;border-radius:6px;font:inherit;font-weight:650;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.note{font-size:13px;color:#627168}.notice{padding:12px;background:#edf5ef;border-radius:5px;margin-bottom:18px;overflow-wrap:anywhere}.error{background:#faebe6;color:#823d2e}table{width:100%;border-collapse:collapse;font-size:14px}td,th{text-align:left;padding:12px;border-bottom:1px solid #e3e7e2;overflow-wrap:anywhere}.table-wrap{overflow-x:auto}footer{font-size:13px;color:#738278}code{overflow-wrap:anywhere} @media(max-width:720px){.hero{grid-template-columns:1fr;gap:24px;padding:30px 0}.card{padding:22px}header,main,footer{padding:20px}}</style></head><body><header><a href="/">{{ title }}</a><a href="/admin">Operator</a></header><main>{% block content %}{% endblock %}</main><footer>Small tools for everyday work.</footer></body></html>
